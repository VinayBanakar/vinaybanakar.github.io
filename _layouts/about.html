---
layout: page
---
<style>
  body {
    background-color: #fafaf8;
  }
  /* .content {
    text-align: justify;
  } */
</style>

{% if page.profile %}
  <div class="profile col one {{ page.profile.align }}">
    {% if page.profile.image %}
      <img class="one" src="{{ page.profile.image | prepend: '/assets/img/' | prepend: site.baseurl | prepend: site.url }}">
      <p  style="text-align: center;"><a style="font-family:monospace;text-decoration:none;" href="mailto:vny@google.com">vny AT google.com</a></p>
    {% endif %}
    {% if page.profile.address %}
      <div class="address">
        {{ page.profile.address }}
      </div>
    {% endif %}
  </div>
{% endif %}

{{ content }}
